name: Sync tokens from Figma (API — 需 Enterprise，目前不可用)

# 從 Figma Variables REST API 更新 tokens/，再產出各平台檔案。
#
# 【目前不可用】Variables REST API 只對 Figma Enterprise 方案開放，
# Pinkoi 是 Professional，token 的 scope 清單裡根本沒有 file_variables:read。
# 這個 workflow 是備而不用 —— 方案升級到 Enterprise 的那天就能跑。
#
# 現在請改用「Sync tokens from Figma (link)」，那條不需要任何權限。
#
# 刻意「不」設 schedule:排程只會每週一失敗一次、寄一封失敗通知給你，
# 除了製造雜訊沒有任何作用。
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 先擋在這裡，給一個看得懂的錯誤訊息 ——
      # 否則沒設 secret 時會壞在 node 裡面，訊息很難懂。
      - name: Check Figma credentials
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          if [ -z "$FIGMA_TOKEN" ] || [ -z "$FIGMA_FILE_KEY" ]; then
            echo "::error::尚未設定 FIGMA_TOKEN / FIGMA_FILE_KEY secret。不過即使設了，這個 workflow 目前也跑不完 —— Variables REST API 只對 Figma Enterprise 開放，Pinkoi 是 Professional。請改用「Sync tokens from Figma (link)」workflow。"
            exit 1
          fi

      - run: npm ci

      - name: Pull variables from Figma → tokens/
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: npm run sync:api

      - name: Build platform outputs
        run: npm run build

      # 有變動才開 PR —— 不直接 push 到 main，
      # 讓工程師有機會 review 色值改動的影響範圍。
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: sync color tokens from Figma'
          title: 'chore: sync color tokens from Figma'
          body: |
            Figma variables 有變動，已自動同步。

            完整的新增／變動／刪除清單見 Actions log。

            請確認:
            - [ ] 色值改動是否符合預期
            - [ ] 有沒有 token 被意外刪除（會導致下游 build 失敗）
            - [ ] 略過與待填的變數清單（見 Actions log）是否有該納入卻漏掉的
          branch: chore/sync-figma-tokens
          delete-branch: true
