name: Build tokens

# 驗證 tokens/ → platform/ 這段。不需要任何 secret —— 只吃 repo 裡的檔案，不碰網路。
on:
  push:
    branches: ['**']
  pull_request:
  # 手動觸發。注意:這個按鈕只會出現在預設分支（main）的 Actions 頁面上，
  # 這是 GitHub 的行為，不是設定問題。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build tokens → platform
        run: npm run build

      # platform/ 有進版控（SPM 需要直接從 git 拉檔案），
      # 所以它必須跟 tokens/ 保持同步。
      # 有人改了 tokens/ 卻忘了重跑 build，這一步會擋下來。
      - name: Check platform/ is up to date
        run: |
          if ! git diff --exit-code --stat platform/; then
            echo "::error::platform/ 與 tokens/ 不同步。請在本機跑 npm run build 後把 platform/ 一起 commit。"
            exit 1
          fi
